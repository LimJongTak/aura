    value: AIzaSyDWIG2YnwZIOkLe15gFQt-L7KhHJTBxGRg
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: aura-d2e32.firebaseapp.com
